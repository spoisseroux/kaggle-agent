name: ai-memory-stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: claude-memory-postgres
    environment:
      POSTGRES_DB: claude_memory
      POSTGRES_USER: claude
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /opt/docker-config/claude-memory/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude -d claude_memory"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: claude-memory-qdrant
    volumes:
      - /opt/docker-config/claude-memory/qdrant:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  mcp:
    image: claude-memory-mcp:latest
    container_name: claude-memory-mcp
    environment:
      POSTGRES_DSN: postgresql://claude:${POSTGRES_PASSWORD}@postgres:5432/claude_memory
      QDRANT_URL: http://qdrant:6333
      BEARER_TOKEN: ${BEARER_TOKEN}
      HF_HOME: /models
    volumes:
      - model_cache:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    ports:
      - 3000:3000
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL}
      NEXTAUTH_URL: http://docker:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: false
    restart: unless-stopped
    depends_on:
      - postgres

  langfuse-worker:
    image: langfuse/langfuse-worker:2
    container_name: langfuse-worker
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL}
      NEXTAUTH_URL: http://docker:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: false
    restart: unless-stopped
    depends_on:
      - postgres

  jupyterlab:
    image: quay.io/jupyter/tensorflow-notebook:latest
    container_name: kaggle-jupyterlab
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      GRANT_SUDO: "yes"
      POSTGRES_DSN: postgresql://claude:${POSTGRES_PASSWORD}@postgres:5432/claude_memory
      QDRANT_URL: http://qdrant:6333
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_KEY: ${KAGGLE_KEY}
      NB_UID: 1000
      NB_GID: 1000
      CHOWN_HOME: "yes"
    volumes:
      # Mount kaggle-agent repo for live editing
      - /home/keehar/kaggle-agent:/home/jovyan/work
      # Share model cache with MCP
      - model_cache:/models
      # Persist Jupyter config and extensions
      - jupyter_config:/home/jovyan/.jupyter
      # Persist conda environments
      - jupyter_conda:/opt/conda
    ports:
      - "8888:8888"
    user: root
    working_dir: /home/jovyan/work
    command: >
      bash -c "
      echo 'Installing Kaggle ML packages...' &&
      pip install --quiet --no-cache-dir \
        lightgbm xgboost catboost \
        optuna mlflow langfuse \
        kaggle plotly seaborn scikit-learn \
        psycopg2-binary qdrant-client tqdm &&
      echo 'Setting permissions...' &&
      chown -R 1000:1000 /home/jovyan &&
      echo 'Starting JupyterLab...' &&
      start-notebook.sh \
        --ServerApp.token='${JUPYTER_TOKEN}' \
        --ServerApp.password='' \
        --ServerApp.allow_origin='*' \
        --ServerApp.ip='0.0.0.0'
      "
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant

volumes:
  pgdata:
  model_cache:
  jupyter_config:
  jupyter_conda:
